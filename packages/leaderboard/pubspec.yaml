name: leaderboard
description: >-
  Accumulates score deltas into running totals and ranks them. The domain layer.
  Pure Dart: it does not depend on flutter, so `import 'package:flutter/...'`
  here is a compile error — the same guarantee the Android build gets from
  `:leaderboard` being a java-library with no Android SDK on its classpath.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  equatable: ^2.0.7

dev_dependencies:
  test: ^1.25.8
  very_good_analysis: ^7.0.0
